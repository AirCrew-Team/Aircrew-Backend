openapi: 3.0.3
info:
  title: AirCrew - Admin
  version: 1.0.0
  description: |
    Autenticación, usuarios, roles e invitación de tripulantes.
    Los JWT se firman con HS256 y el issuer `aircrew-admin`. Crew y Flights validan esos mismos tokens.
servers:
  - url: http://localhost:3005
tags:
  - name: Salud
  - name: Autenticación
  - name: Usuarios
  - name: Mi cuenta
  - name: Interno
    description: Endpoints para otros servicios, no para el frontend.

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: supervisor@aircrew.com }
                password: { type: string, format: password }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credenciales inválidas o cuenta sin activar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Mi cuenta (cualquier rol)
      description: La cuenta del usuario del token. Sirve para restaurar la sesión al recargar la página.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cuenta del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El usuario del token ya no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/activate:
    post:
      tags: [Autenticación]
      summary: Activar cuenta de tripulante y definir contraseña
      description: El token llega por correo en el enlace de invitación. Es de un solo uso y vence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: Entre 12 y 72 bytes UTF-8.
      responses:
        '200':
          description: Cuenta activada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Cuenta activada. Ya puedes iniciar sesión. }
                  user: { $ref: '#/components/schemas/UserSummary' }
        '400':
          description: Datos inválidos o token inválido/vencido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/bootstrap/super-admin:
    post:
      tags: [Autenticación]
      summary: Crear el primer super_admin
      description: Solo funciona si todavía no existe ningún super_admin.
      security:
        - bootstrapKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: Entre 12 y 72 bytes UTF-8.
      responses:
        '201':
          description: Super_admin creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Ya existe un super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo super_admin)
      description: Ordenados por nombre. Sin paginación.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Busca en nombre o email, sin importar mayúsculas.
          schema: { type: string, example: samuel }
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear un supervisor o super_admin (solo super_admin)
      description: Los tripulantes no se crean aquí; se registran con POST /crew/crew-members, que crea la cuenta y el perfil juntos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: Entre 12 y 72 bytes UTF-8.
                role: { type: string, enum: [supervisor, super_admin] }
      responses:
        '201':
          description: Usuario creado. No incluye token; el usuario obtiene el suyo con POST /auth/login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/DuplicateEmail' }

  /users/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar un usuario
      description: super_admin puede consultar cualquier usuario; los demás roles, solo su propia cuenta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    patch:
      tags: [Usuarios]
      summary: Editar un usuario (solo super_admin)
      description: |
        Solo se aplican los campos enviados. El rol solo cambia entre supervisor y super_admin
        (un tripulante sigue siendo crew). Un super_admin no puede quitarse su rol ni desactivarse.
        Una cuenta pendiente de activación no se puede activar aquí.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [supervisor, super_admin] }
                is_active: { type: boolean }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email duplicado, intento de quitarse el rol o desactivarse, o cuenta pendiente de activación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Usuarios]
      summary: Desactivar un usuario (solo super_admin)
      description: |
        No borra el registro (ausencias y asignaciones guardan su id): lo deja con
        `is_active=false` y ya no puede iniciar sesión. Un token ya emitido sigue
        siendo válido hasta que vence (1 h).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Un super_admin no puede desactivarse a sí mismo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/lookup:
    post:
      tags: [Interno]
      summary: Nombres de varios usuarios
      description: Lo usa Crew para mostrar nombres en sus listas.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Usuarios encontrados (los ids que no existen se omiten)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    email: { type: string, format: email }
                    is_active: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/crew-registration:
    post:
      tags: [Interno]
      summary: Crear cuenta pendiente de tripulante y enviar invitación
      description: |
        Lo llama Crew al registrar un tripulante. Crea la cuenta con rol `crew`, sin contraseña,
        y envía el correo de activación con Resend.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Cuenta pendiente creada y correo enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/DuplicateEmail' }
        '502':
          description: Resend no pudo enviar el correo (la cuenta pendiente queda creada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bases/me:
    get:
      tags: [Mi cuenta]
      summary: Mi base (encabezado del inicio, cualquier rol)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Base del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { type: string, example: Jefatura de Operaciones de Vuelo }
                  hq_code: { type: string, example: BOG-HQ }
                  base_name: { type: string, example: Base Eldorado }
                  city: { type: string, example: Bogotá }
                  iata: { type: string, example: BOG }
                  icao: { type: string, example: SKBO }
                  operational_condition: { type: string, enum: [normal, degraded, critical] }
        '404':
          description: 'El usuario no tiene base (code: no_base)'

  /users/me/profile:
    get:
      tags: [Mi cuenta]
      summary: Mi perfil (cualquier rol)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
    patch:
      tags: [Mi cuenta]
      summary: Cambiar mi teléfono
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, nullable: true, example: '+573001234567', description: Formato E.164. }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/notification-preferences:
    get:
      tags: [Mi cuenta]
      summary: Mis preferencias de notificación
      description: |
        Dependen del rol. Supervisor y super_admin: absence_alerts, ai_suggestions_ready,
        deadline_missed. Tripulante: urgent_replacement, gate_changes, certification_expiry.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias (true = activada)
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: boolean }, example: { absence_alerts: true, ai_suggestions_ready: true, deadline_missed: false } }
    patch:
      tags: [Mi cuenta]
      summary: Cambiar mis preferencias (cualquier subconjunto)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: boolean }, example: { deadline_missed: false } }
      responses:
        '200':
          description: Todas las preferencias, ya actualizadas
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bootstrapKey:
      type: apiKey
      in: header
      name: x-bootstrap-key
    serviceKey:
      type: apiKey
      in: header
      name: x-service-key

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Falta autenticación o no es válida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DuplicateEmail:
      description: Ya existe un usuario con ese email
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [crew, supervisor, super_admin]
    Health:
      type: object
      properties:
        service: { type: string, example: admin }
        status: { type: string, example: ok }
    Error:
      type: object
      properties:
        error: { type: string }
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    User:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }
            pending_activation: { type: boolean, description: Tripulante invitado que todavía no activa su cuenta. }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        token: { type: string, description: JWT }
    MyProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        base: { type: string, nullable: true, example: BOG }
        shift: { type: string, nullable: true, enum: [morning, afternoon, night] }
        account_status: { type: string, enum: [active, inactive] }
        security:
          type: object
          properties:
            last_password_change_at: { type: string, format: date-time, nullable: true }
