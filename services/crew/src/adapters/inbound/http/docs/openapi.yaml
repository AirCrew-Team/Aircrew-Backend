openapi: 3.0.3
info:
  title: AirCrew - Crew
  version: 1.0.0
  description: |
    Tripulantes y ausencias. Usa los JWT emitidos por Admin (inicia sesión en Admin con `POST /auth/login`).
servers:
  - url: http://localhost:3002
tags:
  - name: Salud
  - name: Tripulantes
  - name: Ausencias
  - name: Turno
  - name: Interno
    description: Endpoints para otros servicios (token de servicio), no para el frontend.

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: crew }
                  status: { type: string, example: ok }

  /crew-members:
    get:
      tags: [Tripulantes]
      summary: Listar tripulantes (supervisor o super_admin)
      description: Perfiles de tripulación ordenados por código de empleado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tripulantes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /crew-members/me:
    get:
      tags: [Tripulantes]
      summary: Mi perfil de tripulante (crew)
      description: Base, cargo y estado del tripulante que inició sesión.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo para tripulantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El usuario no tiene perfil de tripulante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences:
    post:
      tags: [Ausencias]
      summary: Reportar una ausencia (crew)
      description: |
        Dos formas:

        **Por vuelo** (`flight_id`, `reason`, `notes`): no podrá cumplir ese vuelo. El vuelo debe ser suyo
        y no haber salido (404 `flight_not_assigned`, 409 `flight_departed`, 409 `duplicate_absence`).
        Es una solicitud de reemplazo: queda con `suggestions_state: searching` y Recommendation busca
        candidatos con Claude en segundo plano.

        **Por fechas** (`start_date`, `end_date`, `reason`, `notes`, `attachment`): no podrá trabajar esos días.
        Por cada vuelo suyo que salga en esas fechas (días de la zona horaria de su base; sin base, Nueva York) y no haya salido, se crea además
        una ausencia por vuelo con `parent_absence_id` = esta, y cada una es una solicitud de reemplazo.
        La respuesta las trae en `replacement_requests`. Si Flights no responde, la ausencia se guarda
        igual, sin solicitudes.
        - `start_date` puede ser como mucho de ayer (margen por la zona horaria) y como máximo de dentro de 365 días; `end_date` es igual o posterior, con 30 días como máximo entre ambas.
        - El comprobante es obligatorio si el motivo es `illness`. Va en base64: PDF, PNG o JPG de hasta 10 MB ya decodificado, y sus primeros bytes deben coincidir con `mime_type`.
        - `file_name` se normaliza: solo se quita una extensión conocida (`.pdf`, `.png`, `.jpg`, `.jpeg`, sin distinguir mayúsculas), se añade la del tipo real (`.pdf`, `.png` o `.jpg`) y la base se recorta para que el total no pase de 255 caracteres. «Dr. Pérez» se guarda como «Dr. Pérez.pdf» y un nombre vacío tras quitar la extensión, como «comprobante.pdf».
        - La ausencia y el comprobante se guardan en una sola transacción. Esta ruta acepta un body JSON de hasta 15 MB; las demás, 100 kB.
        - Avisa en segundo plano a los supervisores conectados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              description: Envía flight_id (por vuelo) o start_date y end_date (por fechas).
              properties:
                flight_id: { type: string, format: uuid, description: Solo para la ausencia por vuelo. }
                start_date: { type: string, format: date, example: '2026-11-20' }
                end_date: { type: string, format: date, example: '2026-11-22' }
                reason: { $ref: '#/components/schemas/AbsenceReason' }
                notes: { type: string, maxLength: 500, nullable: true, example: Fiebre alta desde la madrugada. }
                attachment:
                  type: object
                  nullable: true
                  required: [file_name, mime_type, data_base64]
                  properties:
                    file_name: { type: string, example: incapacidad.pdf, description: 'Se normaliza con la extensión del tipo real y como máximo 255 caracteres (no da 400 por largo).' }
                    mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
                    data_base64: { type: string, format: byte, description: Contenido del archivo en base64. }
      responses:
        '201':
          description: Ausencia reportada, con los metadatos del comprobante y sin sus bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Absence' }
        '400':
          description: |
            Fechas, motivo, observaciones o comprobante inválidos. Por ejemplo, un `start_date`
            de más de 365 días desde hoy: «La fecha de inicio no puede ser posterior a 365 días desde hoy.»
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo un tripulante puede reportar ausencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya tiene una ausencia cuyas fechas se cruzan con estas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Ya tienes una ausencia reportada que se cruza con esas fechas. }
        '413':
          description: El body supera los 15 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Ausencias]
      summary: Listar ausencias (supervisor o super_admin)
      description: |
        Las más recientes primero, con el código y cargo del tripulante.
        **Cola de reemplazos:** `?status=reported&kind=flight` (solo ausencias por vuelo, por salida más próxima).
        `kind=dates` lista las ausencias por fechas (con su comprobante). Sin `kind`, todas.
        Cada ausencia trae además gate, origin_name, destination_name y aircraft_family del vuelo
        (en null si el servicio de vuelos no responde).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AbsenceStatus' }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [flight, dates] }
      responses:
        '200':
          description: Ausencias
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/AbsenceWithCrewMember'
                    - type: object
                      properties:
                        gate: { type: string, nullable: true, example: A12 }
                        origin_name: { type: string, nullable: true, example: John F. Kennedy International }
                        destination_name: { type: string, nullable: true, example: Aeropuerto Internacional de Miami }
                        aircraft_family: { type: string, nullable: true, example: A320 }
        '400':
          description: status inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/me:
    get:
      tags: [Ausencias]
      summary: Mis ausencias (crew)
      description: |
        Las ausencias del tripulante que inició sesión, la más reciente primero (por created_at).
        Cada ausencia por fechas trae en `flights` las ausencias de sus vuelos (`parent_absence_id`),
        ordenadas por salida. Una ausencia reportada directamente sobre un vuelo sale sola, con sus
        datos de vuelo y `flights` vacío. El frontend las cruza con `GET /api/flights/assignments/me`
        por `flight_id`. No incluye datos del reemplazo, de quién aprobó ni plazos.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: Día AAAA-MM-DD. Por fechas, las que terminan ese día o después; por vuelo, las que salen ese día o después (día local de la base del tripulante; sin base, Nueva York). Las de los vuelos de una ausencia por fechas siempre salen con ella.
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: to
          in: query
          description: Día AAAA-MM-DD, no anterior a from. Por fechas, las que empiezan ese día o antes; por vuelo, las que salen ese día o antes.
          schema: { type: string, format: date, example: '2026-11-30' }
      responses:
        '200':
          description: Mis ausencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyAbsence' }
        '400':
          description: from o to no son fechas válidas, o to es anterior a from (field from o to)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo para tripulantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/tracking:
    get:
      tags: [Ausencias]
      summary: Seguimiento del turno (supervisor o super_admin)
      description: |
        Ausencias de los vuelos que salen en un día (día local de la base de ?base=; sin base, Nueva York), con su línea de tiempo.
        Orden: por aprobar (sin candidatos primero, luego por salida más próxima, al final las que
        la IA sigue buscando), esperando confirmación (por plazo), cubiertas (más reciente primero).
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: AAAA-MM-DD. Por defecto, hoy en la zona de la base.
          schema: { type: string, example: '2026-11-19' }
        - name: base
          in: query
          required: false
          description: IATA de la base del supervisor (iata de GET /api/admin/bases/me). Fija la zona horaria del día; sin base, Nueva York.
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Ausencias del día
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackingItem' }
        '400':
          description: Fecha inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/stats:
    get:
      tags: [Ausencias]
      summary: Indicadores de ausencias (supervisor o super_admin)
      description: La tasa de resolución es el porcentaje de ausencias cubiertas en los últimos 30 días. «Cubiertas hoy» cuenta el día local de la base.
      security:
        - bearerAuth: []
      parameters:
        - name: base
          in: query
          required: false
          description: IATA de la base del supervisor (iata de GET /api/admin/bases/me). Fija la zona horaria del día; sin base, Nueva York.
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported: { type: integer, description: Por aprobar. }
                  pending_ack: { type: integer, description: Esperando «Enterado». }
                  covered_today: { type: integer }
                  resolution_rate: { type: number, nullable: true, example: 85.7 }

  /absences/{id}/approve:
    patch:
      tags: [Ausencias]
      summary: Aprobar un reemplazo (lo usa Recommendation al confirmar)
      description: La ausencia pasa de reported a pending_ack (esperando «Enterado»).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement_user_id, deadline_at]
              properties:
                replacement_user_id: { type: string, format: uuid }
                deadline_at: { type: string, format: date-time }
                option: { type: integer, description: Lugar del candidato en la lista. }
      responses:
        '200':
          description: Ausencia esperando confirmación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Absence' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ausencia no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La ausencia ya no está esperando reemplazo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/missed:
    patch:
      tags: [Interno]
      summary: El reemplazo dejó vencer el plazo (token de servicio)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La ausencia vuelve a reported

  /absences/acknowledged:
    post:
      tags: [Interno]
      summary: El reemplazo dio «Enterado» (token de servicio, lo llama Flights)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flight_id, replacement_user_id]
              properties:
                flight_id: { type: string, format: uuid }
                replacement_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Ausencia cubierta

  /absences/expired:
    get:
      tags: [Interno]
      summary: Ausencias con el plazo de «Enterado» vencido (token de servicio)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ausencias vencidas

  /absences/{id}/suggestions:
    patch:
      tags: [Interno]
      summary: Resultado de la búsqueda de candidatos (token de servicio, lo llama Recommendation)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [searching, ready, none, error] }
                candidate_count: { type: integer }
      responses:
        '200':
          description: Estado actualizado

  /absences/{id}:
    get:
      tags: [Ausencias]
      summary: Consultar una ausencia (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ausencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsenceWithCrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ausencia no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/attachment:
    get:
      tags: [Ausencias]
      summary: Descargar el comprobante de una ausencia (supervisor o super_admin)
      description: |
        Responde los bytes del archivo con su `Content-Type`, `X-Content-Type-Options: nosniff`,
        `Cache-Control: private, no-store` (documento médico: no queda en cachés) y
        `Content-Disposition: attachment` con dos parámetros (RFC 6266):
        - `filename="…"`: el nombre en ASCII, sin rutas, comillas ni saltos de línea, para clientes antiguos.
        - `filename*=UTF-8''…`: el nombre real codificado en UTF-8, con tildes; los navegadores lo prefieren.

        Ejemplo: `attachment; filename="Dr. Perez.pdf"; filename*=UTF-8''Dr.%20P%C3%A9rez.pdf`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comprobante
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La ausencia no existe o no tiene comprobante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/cover:
    patch:
      tags: [Ausencias]
      summary: Marcar una ausencia como cubierta (supervisor o super_admin)
      description: |
        Guarda quién reemplaza al tripulante. Lo usa el motor de recomendación después
        de hacer el reemplazo en Flights.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement_user_id]
              properties:
                replacement_user_id: { type: string, format: uuid, description: Id del usuario del tripulante que reemplaza. }
      responses:
        '200':
          description: Ausencia cubierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Absence' }
        '400':
          description: replacement_user_id inválido o igual al tripulante ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ausencia no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La ausencia ya está cubierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/current:
    get:
      tags: [Turno]
      summary: Turno actual (banner del inicio del supervisor y guardia del inicio del super_admin)
      description: Supervisor o super_admin. Sin base, el resumen junta todas las bases (base null) con el día y el turno de Nueva York, para cualquiera de los dos roles.
      security:
        - bearerAuth: []
      parameters:
        - name: base
          in: query
          description: IATA de la base (la del supervisor sale de GET /api/admin/bases/me). Fija la zona horaria del turno y de «hoy». Sin base, todas y la hora de Nueva York.
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Turno
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { type: string, enum: [morning, afternoon, night], description: 'Hora local de la base (sin base, Nueva York): 06–14, 14–22, 22–06' }
                  base: { type: string, nullable: true }
                  flights_today: { type: integer }
                  standby_total: { type: integer, description: De guardia. }
                  standby_ready: { type: integer, description: De guardia y sin impedimento para reemplazar. }
                  staffing_delays: { type: integer }
        '400':
          description: base no es un código IATA de 3 letras
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo supervisor o super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-crew:
    get:
      tags: [Turno]
      summary: Tripulación del turno (supervisor o super_admin)
      description: |
        Ya ordenada: guardia (por minutos a rampa), en vuelo (por llegada), programados (por
        presentación), descanso (por fin), ausentes y libres. La ubicación y los minutos a rampa
        son los declarados al iniciar la guardia.
      security:
        - bearerAuth: []
      parameters:
        - name: base
          in: query
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Tripulantes del turno
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, nullable: true }
                  shift: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      description: |
                        Campos comunes más, según status:
                        standby (location, minutes_to_ramp, guard_until, replacement_blocker),
                        in_flight (flight, arrival_at), scheduled (flight, report_at),
                        rest (rest_until), absent (flight, reason), available.
                      properties:
                        id: { type: string, format: uuid }
                        employee_code: { type: string }
                        full_name: { type: string }
                        position: { type: string }
                        rank: { type: string }
                        phone: { type: string, nullable: true }
                        radio_channel: { type: string, nullable: true }
                        status: { type: string, enum: [standby, in_flight, scheduled, rest, absent, available] }
                        expiring_certification:
                          type: object
                          nullable: true
                          properties:
                            name: { type: string, example: Certificado médico }
                            days_left: { type: integer }

  /crew-members/me/metrics:
    get:
      tags: [Tripulantes]
      summary: Métricas de Mis Vuelos (crew)
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          description: AAAA-MM. Por defecto, el mes actual.
          schema: { type: string, example: '2026-11' }
      responses:
        '200':
          description: Horas del mes (FDP), descanso y sectores
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  fdp: { type: object, properties: { used_hours: { type: number }, max_hours: { type: integer, example: 100 }, regulation: { type: string, example: FAA 14 CFR Part 117 }, cycle_closes_on: { type: string } } }
                  rest: { type: object, properties: { last_duty_end_at: { type: string, format: date-time, nullable: true }, rest_ends_at: { type: string, format: date-time, nullable: true }, guaranteed_minutes: { type: integer, example: 600 } } }
                  sectors: { type: object, properties: { completed: { type: integer }, scheduled: { type: integer }, domestic: { type: integer }, international: { type: integer }, crew_delays: { type: integer } } }
  /certifications:
    get:
      tags: [Certificaciones]
      summary: Tabla de certificaciones, paginada (solo super_admin)
      description: |
        Tripulantes activos con su certificación. Primero los sin certificado, luego por verificar y verificados.
        `search` busca en nombre, ID (código) y número de licencia, sin mayúsculas ni tildes.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 5 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CertificationStatus' } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CrewCertification' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/stats:
    get:
      tags: [Certificaciones]
      summary: Indicadores y conteos de los filtros (solo super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  by_status:
                    type: object
                    properties:
                      verified: { type: integer }
                      pending_verification: { type: integer }
                      uncertified: { type: integer }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/options:
    get:
      tags: [Certificaciones]
      summary: Certificados y los que permite cada cargo (solo super_admin)
      description: |
        Pilotos (Comandante, Copiloto) PPL, CPL, ATP, IR y ME, con al menos una licencia (PPL, CPL o ATP).
        Auxiliar de Vuelo solo CDP. Sobrecargos CDP (obligatorio), LID, CONF y ADU.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: ATP }
                        name: { type: string, example: Airline Transport Pilot (ATP) }
                        short: { type: string, example: ATP }
                  by_position:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        area: { type: string, enum: [flight_deck, cabin] }
                        certificates: { type: array, items: { type: string } }
                  pilot_licenses: { type: array, items: { type: string } }
                  cabin_license: { type: string }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/uncertified:
    get:
      tags: [Certificaciones]
      summary: Tripulantes activos sin certificado, para «Registrar certificado» (solo super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tripulantes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CrewCertification' } }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/me:
    get:
      tags: [Certificaciones]
      summary: Mi certificación (crew)
      description: |
        La certificación del tripulante que inició sesión, con el nombre de cada certificado (no puede
        pedir `/certifications/options`). Sin nombre ni correo (salen de la sesión) y sin historial.
        El único vencimiento con fecha es el del certificado médico (`medical_expires_on`, del perfil);
        no se guarda fecha de vencimiento para las licencias ni los certificados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mi certificación (status uncertified si todavía no tiene)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCertification' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo para tripulantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El usuario no tiene perfil de tripulante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/{userId}:
    get:
      tags: [Certificaciones]
      summary: Ficha de la certificación, con copia e historial (solo super_admin)
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificationDetail' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Certificaciones]
      summary: Registrar o editar la certificación (solo super_admin)
      description: |
        `verified: true` la deja «verificada»; `false`, «por verificar» (así también se quita la verificación).
        `file` en base64: PDF, PNG o JPG de hasta 5 MB; sin `file` se deja la copia que había y con `null` se quita.
        `file.file_name` se normaliza igual que el comprobante de una ausencia: solo se quita una extensión
        conocida (`.pdf`, `.png`, `.jpg`, `.jpeg`), se añade la del tipo real y el total queda en 255 caracteres
        como máximo («certificado.pdf» si el nombre queda vacío).
        Deja en el historial «registrado» o «actualizado», y «verificado» cuando pasa a verificada. Esta ruta
        acepta un body de hasta 8 MB y lo lee después de comprobar la sesión.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, certificates, verified]
              properties:
                license_number: { type: string, pattern: '^[0-9]{5,10}$', example: '2775981' }
                certificates: { type: array, minItems: 1, items: { type: string }, example: [ATP, IR, ME] }
                verified: { type: boolean }
                file:
                  type: object
                  nullable: true
                  properties:
                    file_name: { type: string }
                    mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
                    data_base64: { type: string }
      responses:
        '200':
          description: Ficha actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificationDetail' }
        '400':
          description: Licencia, certificados o copia inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El tripulante está desactivado o su cargo no tiene certificados definidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: El body supera 8 MB
    delete:
      tags: [Certificaciones]
      summary: Eliminar la certificación (solo super_admin)
      description: El tripulante queda «sin certificado», sin licencia, certificados, copia ni historial.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Eliminada
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado o sin certificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/{userId}/file:
    get:
      tags: [Certificaciones]
      summary: Descargar la copia del certificado (solo super_admin)
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            El archivo original, con `X-Content-Type-Options: nosniff`, `Cache-Control: private, no-store` y
            `Content-Disposition: attachment; filename="<nombre en ASCII>"; filename*=UTF-8''<nombre real codificado>`
            (RFC 6266: los navegadores usan `filename*`, que conserva las tildes).
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Sin certificación o sin copia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/crew-members:
    get:
      tags: [Interno]
      summary: Listar todos los perfiles (solo Admin)
      description: Lo usa Admin para la lista y los indicadores de la pantalla Usuarios.
      security:
        - adminServiceKey: []
      responses:
        '200':
          description: Perfiles, ordenados por código
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrewProfile' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Interno]
      summary: Crear el perfil de un tripulante (solo Admin)
      description: |
        Admin lo llama en POST /users después de crear la cuenta pendiente. `employee_code` es opcional:
        sin él se asigna el siguiente de la secuencia (AC-0001, AC-0002…), saltando los que ya existan. Se
        guarda en mayúsculas. `base` es un código IATA de 3 letras y también queda como `current_location`
        inicial. `status` vale `available` si no se envía.
      security:
        - adminServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, position]
              properties:
                user_id: { type: string, format: uuid }
                employee_code: { type: string, example: AC-1108 }
                position: { type: string, maxLength: 40, example: Comandante }
                base: { type: string, nullable: true, example: ATL }
                status: { $ref: '#/components/schemas/CrewStatus' }
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Código de empleado repetido o la cuenta ya tiene perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/crew-members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Interno]
      summary: Perfil de un tripulante (solo Admin)
      security:
        - adminServiceKey: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Interno]
      summary: Editar o desactivar el perfil (solo Admin)
      description: Solo se aplican los campos enviados. `base` en `null` o vacía la quita.
      security:
        - adminServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                employee_code: { type: string }
                position: { type: string, maxLength: 40 }
                base: { type: string, nullable: true }
                status: { $ref: '#/components/schemas/CrewStatus' }
                is_active: { type: boolean }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '400':
          description: Datos inválidos o body sin campos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Código de empleado repetido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Interno]
      summary: Borrar un perfil sin historial (solo Admin)
      description: |
        Solo para deshacer un alta que no terminó (por ejemplo, si falló el correo). Un perfil con
        ausencias nunca se borra: responde 409 y hay que desactivarlo con PATCH.
      security:
        - adminServiceKey: []
      responses:
        '204':
          description: Perfil borrado
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El tripulante tiene ausencias registradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/users/{userId}:
    delete:
      tags: [Interno]
      summary: Borrar todo lo de una cuenta eliminada (solo Admin)
      description: |
        Lo usa Admin al eliminar una cuenta (`DELETE /users/{id}/permanent`). En una transacción:
        las ausencias de otros en las que esperaba dar «Enterado» como reemplazo vuelven a la cola
        (`reopened_absences`, con un evento en su línea de tiempo); se borran sus ausencias (con sus
        hijas, comprobantes y eventos), su certificación (con archivo e historial) y su perfil.
        Repetirlo no falla: devuelve 0. El gateway responde 404 a `/api/crew/internal/*`.
      security:
        - adminServiceKey: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Datos borrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: integer, description: 1 si tenía perfil. }
                  certifications: { type: integer }
                  absences: { type: integer, description: Ausencias borradas, contando las hijas. }
                  reopened_absences: { type: integer }
        '400':
          description: Id inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminServiceKey:
      type: apiKey
      in: header
      name: x-service-key
      description: ADMIN_SERVICE_KEY, la misma en admin/.env y crew/.env.

  schemas:
    AbsenceReason:
      type: string
      enum: [illness, fatigue, emergency, transfer]
      description: illness (incapacidad), fatigue (fatiga), emergency (calamidad), transfer (traslado)
    Absence:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SOL-00042, description: Número de solicitud legible. }
        kind: { type: string, enum: [flight, dates], description: Por vuelo (solicitud de reemplazo) o por fechas. }
        parent_absence_id: { type: string, format: uuid, nullable: true, description: Ausencia por fechas de la que salió. }
        crew_user_id: { type: string, format: uuid }
        flight_id: { type: string, format: uuid, nullable: true, description: Solo en las ausencias antiguas por vuelo. }
        flight_number: { type: string, nullable: true, example: AC201 }
        flight_departure_at: { type: string, format: date-time, nullable: true }
        start_date: { type: string, format: date, nullable: true, example: '2026-11-20', description: null en las ausencias antiguas por vuelo. }
        end_date: { type: string, format: date, nullable: true, example: '2026-11-22' }
        attachment:
          allOf:
            - $ref: '#/components/schemas/AbsenceAttachment'
          nullable: true
          description: Metadatos del comprobante, o null si no tiene. Nunca incluye los bytes. No viene en la respuesta de cubrir.
        reason: { $ref: '#/components/schemas/AbsenceReason' }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
        suggestions_state: { type: string, nullable: true, enum: [searching, ready, none, error] }
        slot_role: { type: string, nullable: true, example: first_officer }
        flight_origin: { type: string, nullable: true, example: JFK }
        flight_destination: { type: string, nullable: true, example: MIA }
        deadline_at: { type: string, format: date-time, nullable: true, description: Plazo para el «Enterado». }
        approved_at: { type: string, format: date-time, nullable: true }
        candidate_count: { type: integer, nullable: true }
        replacement_option: { type: integer, nullable: true }
        replacement_user_id: { type: string, format: uuid, nullable: true, description: Quién cubrió la ausencia. }
        covered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AbsenceAttachment:
      type: object
      properties:
        file_name: { type: string, example: incapacidad.pdf, description: Normalizado con la extensión del tipo real. }
        mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size_bytes: { type: integer, example: 48213 }
    AbsenceStatus:
      type: string
      enum: [reported, pending_ack, covered, cancelled]
      description: reported (falta reemplazo), pending_ack (esperando «Enterado» del reemplazo), covered (cubierta), cancelled
    AbsenceWithCrewMember:
      allOf:
        - $ref: '#/components/schemas/Absence'
        - type: object
          properties:
            employee_code: { type: string, nullable: true, example: EMP-001 }
            position: { type: string, nullable: true, example: pilot }
            crew_name: { type: string, nullable: true, description: Nombre desde Admin (null si Admin no responde). }
            replacement_name: { type: string, nullable: true, description: Nombre del reemplazo. }
    TrackingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SOL-00042, description: Número de solicitud legible. }
        flight_id: { type: string, format: uuid }
        flight_number: { type: string, example: DL1102 }
        origin: { type: string, example: JFK }
        destination: { type: string, example: MIA }
        departure_at: { type: string, format: date-time }
        slot_role: { type: string, example: first_officer }
        reason: { $ref: '#/components/schemas/AbsenceReason' }
        reported_by: { type: string, nullable: true, example: Valentina Ríos }
        employee_code: { type: string, nullable: true }
        reported_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
        suggestions_state: { type: string, nullable: true, enum: [searching, ready, none, error] }
        candidate_count: { type: integer }
        replacement:
          type: object
          nullable: true
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string, example: Sebastián Pardo }
            option: { type: integer, nullable: true, example: 2 }
        approval:
          type: object
          nullable: true
          properties:
            by: { type: string, example: Camila Restrepo }
            at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              type: { type: string, enum: [reported, ai_ready, ai_none, ai_error, approved, candidate_missed, acknowledged, covered, cancelled] }
              text: { type: string, example: Andrés Gómez dejó vencer su plazo }
              missed: { type: boolean }
    CrewStatus:
      type: string
      enum: [available, on_duty, in_flight, medical_leave, vacation]
      description: on_duty = de guardia en el aeropuerto
      default: available
    CrewProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        employee_code: { type: string, example: AC-1108 }
        position: { type: string, example: Comandante }
        base: { type: string, nullable: true, example: ATL }
        current_location: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CrewStatus' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    CertificationStatus:
      type: string
      description: verified (Verificado), pending_verification (Por verificar) o uncertified (Sin certificado).
      enum: [verified, pending_verification, uncertified]
    CrewCertification:
      type: object
      description: Fila de la tabla. Se identifica por user_id; employee_code es el ID que se muestra.
      properties:
        user_id: { type: string, format: uuid }
        employee_code: { type: string, example: AC-1108 }
        name: { type: string, nullable: true, description: Desde Admin (null si no responde). }
        email: { type: string, nullable: true }
        position: { type: string, example: Comandante }
        area: { type: string, nullable: true, enum: [flight_deck, cabin] }
        base: { type: string, nullable: true, example: ATL }
        license_number: { type: string, nullable: true }
        certificates: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/CertificationStatus' }
        updated_at: { type: string, format: date-time, nullable: true }
    CertificationDetail:
      allOf:
        - $ref: '#/components/schemas/CrewCertification'
        - type: object
          properties:
            file:
              type: object
              nullable: true
              properties:
                file_name: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer }
            history:
              type: array
              description: Del más reciente al más antiguo.
              items:
                type: object
                properties:
                  event: { type: string, enum: [registered, verified, updated] }
                  by_user_id: { type: string, format: uuid }
                  by: { type: string, nullable: true, description: Nombre del super_admin. }
                  note: { type: string, nullable: true }
                  created_at: { type: string, format: date-time }
    MyCertification:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        employee_code: { type: string, example: AC-1108 }
        position: { type: string, example: Comandante }
        area: { type: string, nullable: true, enum: [flight_deck, cabin] }
        base: { type: string, nullable: true, example: ATL }
        status: { $ref: '#/components/schemas/CertificationStatus' }
        license_number: { type: string, nullable: true, example: '2775981' }
        certificates: { type: array, items: { type: string }, example: [ATP, IR] }
        certificate_details:
          type: array
          description: Los certificados de certificates, en el mismo orden.
          items:
            type: object
            properties:
              code: { type: string, example: ATP }
              name: { type: string, example: Airline Transport Pilot (ATP) }
              short: { type: string, example: ATP }
              is_license: { type: boolean, description: 'Licencia (ATP, CPL, PPL o CDP); el resto son habilitaciones (IR, ME) o cursos.' }
        file:
          type: object
          nullable: true
          description: Metadatos de la copia (la descarga es solo del super_admin).
          properties:
            file_name: { type: string }
            mime_type: { type: string }
            size_bytes: { type: integer }
        updated_at: { type: string, format: date-time, nullable: true }
        medical_expires_on: { type: string, format: date, nullable: true, example: '2027-05-18', description: Vencimiento del certificado médico. }
        ratings: { type: array, items: { type: string }, example: [A320, '787'], description: Familias de avión habilitadas. }
        english_level: { type: integer, nullable: true, minimum: 1, maximum: 6, description: Nivel OACI de inglés. }
    MyAbsenceFlight:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SOL-00043 }
        flight_id: { type: string, format: uuid }
        flight_number: { type: string, example: DL1102 }
        origin: { type: string, example: ATL }
        destination: { type: string, example: JFK }
        departure_at: { type: string, format: date-time }
        slot_role: { type: string, nullable: true, example: captain }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
    MyAbsence:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SOL-00042 }
        kind: { type: string, enum: [flight, dates] }
        reason: { $ref: '#/components/schemas/AbsenceReason' }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
        start_date: { type: string, format: date, nullable: true, description: Solo en las de fechas. }
        end_date: { type: string, format: date, nullable: true }
        flight_id: { type: string, format: uuid, nullable: true, description: Solo en las de un vuelo reportado directamente. }
        flight_number: { type: string, nullable: true }
        origin: { type: string, nullable: true }
        destination: { type: string, nullable: true }
        departure_at: { type: string, format: date-time, nullable: true }
        slot_role: { type: string, nullable: true }
        attachment:
          allOf:
            - $ref: '#/components/schemas/AbsenceAttachment'
          nullable: true
        created_at: { type: string, format: date-time }
        flights:
          type: array
          description: Ausencias de los vuelos de una ausencia por fechas, por salida. Vacío en las de un vuelo.
          items: { $ref: '#/components/schemas/MyAbsenceFlight' }
    Error:
      type: object
      properties:
        error: { type: string }
    CrewMember:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string, format: uuid }
        rank: { type: string, enum: [captain, first_officer, purser, flight_attendant] }
        base_code: { type: string, nullable: true, example: JFK }
        ratings: { type: array, items: { type: string }, example: [A320, '787'] }
        english_level: { type: integer, nullable: true, minimum: 1, maximum: 6 }
        medical_expires_on: { type: string, nullable: true, example: '2027-05-18' }
        hire_date: { type: string, nullable: true, example: '2021-02-12' }
        phone: { type: string, nullable: true }
        radio_channel: { type: string, nullable: true }
        standby_location: { type: string, nullable: true, example: Sala de tripulaciones T1 }
        minutes_to_ramp: { type: integer, nullable: true, example: 12 }
        standby_until: { type: string, format: date-time, nullable: true }
        name: { type: string, nullable: true, description: Nombre desde Admin (null si Admin no responde). Solo en las consultas GET. }
        employee_code: { type: string }
        position: { type: string }
        base: { type: string, nullable: true, description: Hub del tripulante (código IATA). Lo asigna Admin. }
        current_location: { type: string, nullable: true, description: Dónde está ahora; empieza en su base. }
        status: { $ref: '#/components/schemas/CrewStatus' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
