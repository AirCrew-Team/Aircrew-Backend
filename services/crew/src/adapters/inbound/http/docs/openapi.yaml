openapi: 3.0.3
info:
  title: AirCrew - Crew
  version: 1.0.0
  description: |
    Tripulantes y ausencias. Usa los JWT emitidos por Admin (inicia sesión en Admin con `POST /auth/login`).
servers:
  - url: http://localhost:3002
tags:
  - name: Salud
  - name: Tripulantes
  - name: Ausencias

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: crew }
                  status: { type: string, example: ok }

  /crew-members:
    get:
      tags: [Tripulantes]
      summary: Listar tripulantes (supervisor o super_admin)
      description: Perfiles de tripulación ordenados por código de empleado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tripulantes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /crew-members/me:
    get:
      tags: [Tripulantes]
      summary: Mi perfil de tripulante (crew)
      description: Base, cargo y estado del tripulante que inició sesión.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo para tripulantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El usuario no tiene perfil de tripulante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences:
    post:
      tags: [Ausencias]
      summary: Reportar una ausencia (crew)
      description: |
        El tripulante reporta que no podrá trabajar entre dos fechas.
        - `start_date` puede ser como mucho de ayer (margen por la zona horaria) y `end_date` es igual o posterior, con 30 días como máximo entre ambas.
        - El comprobante es obligatorio si el motivo es `illness`. Va en base64: PDF, PNG o JPG de hasta 10 MB ya decodificado, y sus primeros bytes deben coincidir con `mime_type`.
        - La ausencia y el comprobante se guardan en una sola transacción. Esta ruta acepta un body JSON de hasta 15 MB; las demás, 100 kB.
        - Avisa en segundo plano a los supervisores conectados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, reason]
              properties:
                start_date: { type: string, format: date, example: '2026-11-20' }
                end_date: { type: string, format: date, example: '2026-11-22' }
                reason: { $ref: '#/components/schemas/AbsenceReason' }
                notes: { type: string, maxLength: 500, nullable: true, example: Fiebre alta desde la madrugada. }
                attachment:
                  type: object
                  nullable: true
                  required: [file_name, mime_type, data_base64]
                  properties:
                    file_name: { type: string, maxLength: 255, example: incapacidad.pdf }
                    mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
                    data_base64: { type: string, format: byte, description: Contenido del archivo en base64. }
      responses:
        '201':
          description: Ausencia reportada, con los metadatos del comprobante y sin sus bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Absence' }
        '400':
          description: Fechas, motivo, observaciones o comprobante inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo un tripulante puede reportar ausencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya tiene una ausencia cuyas fechas se cruzan con estas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Ya tienes una ausencia reportada que se cruza con esas fechas. }
        '413':
          description: El body supera los 15 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Ausencias]
      summary: Listar ausencias (supervisor o super_admin)
      description: |
        Las más recientes primero, con el código y cargo del tripulante.
        Con `?status=reported` se obtiene la cola de ausencias que todavía necesitan reemplazo.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AbsenceStatus' }
      responses:
        '200':
          description: Ausencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AbsenceWithCrewMember' }
        '400':
          description: status inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}:
    get:
      tags: [Ausencias]
      summary: Consultar una ausencia (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ausencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsenceWithCrewMember' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ausencia no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/attachment:
    get:
      tags: [Ausencias]
      summary: Descargar el comprobante de una ausencia (supervisor o super_admin)
      description: |
        Responde los bytes del archivo con su `Content-Type`, `Content-Disposition: attachment`
        con el nombre saneado (solo ASCII, sin rutas, comillas ni saltos de línea) y
        `X-Content-Type-Options: nosniff`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comprobante
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La ausencia no existe o no tiene comprobante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/cover:
    patch:
      tags: [Ausencias]
      summary: Marcar una ausencia como cubierta (supervisor o super_admin)
      description: |
        Guarda quién reemplaza al tripulante. Lo usa el motor de recomendación después
        de hacer el reemplazo en Flights.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement_user_id]
              properties:
                replacement_user_id: { type: string, format: uuid, description: Id del usuario del tripulante que reemplaza. }
      responses:
        '200':
          description: Ausencia cubierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Absence' }
        '400':
          description: replacement_user_id inválido o igual al tripulante ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: El rol no tiene permiso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Ausencia no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La ausencia ya está cubierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications:
    get:
      tags: [Certificaciones]
      summary: Tabla de certificaciones, paginada (solo super_admin)
      description: |
        Tripulantes activos con su certificación. Primero los sin certificado, luego por verificar y verificados.
        `search` busca en nombre, ID (código) y número de licencia, sin mayúsculas ni tildes.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 5 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CertificationStatus' } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CrewCertification' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/stats:
    get:
      tags: [Certificaciones]
      summary: Indicadores y conteos de los filtros (solo super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  by_status:
                    type: object
                    properties:
                      verified: { type: integer }
                      pending_verification: { type: integer }
                      uncertified: { type: integer }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/options:
    get:
      tags: [Certificaciones]
      summary: Certificados y los que permite cada cargo (solo super_admin)
      description: |
        Pilotos (Comandante, Copiloto) PPL, CPL, ATP, IR y ME, con al menos una licencia (PPL, CPL o ATP).
        Auxiliar de Vuelo solo CDP. Sobrecargos CDP (obligatorio), LID, CONF y ADU.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: ATP }
                        name: { type: string, example: Airline Transport Pilot (ATP) }
                        short: { type: string, example: ATP }
                  by_position:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        area: { type: string, enum: [flight_deck, cabin] }
                        certificates: { type: array, items: { type: string } }
                  pilot_licenses: { type: array, items: { type: string } }
                  cabin_license: { type: string }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/uncertified:
    get:
      tags: [Certificaciones]
      summary: Tripulantes activos sin certificado, para «Registrar certificado» (solo super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tripulantes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CrewCertification' } }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/{userId}:
    get:
      tags: [Certificaciones]
      summary: Ficha de la certificación, con copia e historial (solo super_admin)
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificationDetail' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Certificaciones]
      summary: Registrar o editar la certificación (solo super_admin)
      description: |
        `verified: true` la deja «verificada»; `false`, «por verificar» (así también se quita la verificación).
        `file` en base64: PDF, PNG o JPG de hasta 5 MB; sin `file` se deja la copia que había y con `null` se quita.
        Deja en el historial «registrado» o «actualizado», y «verificado» cuando pasa a verificada. Esta ruta
        acepta un body de hasta 8 MB y lo lee después de comprobar la sesión.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, certificates, verified]
              properties:
                license_number: { type: string, pattern: '^[0-9]{5,10}$', example: '2775981' }
                certificates: { type: array, minItems: 1, items: { type: string }, example: [ATP, IR, ME] }
                verified: { type: boolean }
                file:
                  type: object
                  nullable: true
                  properties:
                    file_name: { type: string }
                    mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
                    data_base64: { type: string }
      responses:
        '200':
          description: Ficha actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificationDetail' }
        '400':
          description: Licencia, certificados o copia inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El tripulante está desactivado o su cargo no tiene certificados definidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: El body supera 8 MB
    delete:
      tags: [Certificaciones]
      summary: Eliminar la certificación (solo super_admin)
      description: El tripulante queda «sin certificado», sin licencia, certificados, copia ni historial.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Eliminada
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Tripulante no encontrado o sin certificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /certifications/{userId}/file:
    get:
      tags: [Certificaciones]
      summary: Descargar la copia del certificado (solo super_admin)
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, description: user_id del tripulante (UUID)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El archivo original, con Content-Disposition attachment, nosniff y sin caché
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401':
          description: Falta autenticación o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Solo el super_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Sin certificación o sin copia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/crew-members:
    get:
      tags: [Interno]
      summary: Listar todos los perfiles (solo Admin)
      description: Lo usa Admin para la lista y los indicadores de la pantalla Usuarios.
      security:
        - adminServiceKey: []
      responses:
        '200':
          description: Perfiles, ordenados por código
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrewProfile' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Interno]
      summary: Crear el perfil de un tripulante (solo Admin)
      description: |
        Admin lo llama en POST /users después de crear la cuenta pendiente. `employee_code` es opcional:
        sin él se asigna el siguiente de la secuencia (AC-0001, AC-0002…), saltando los que ya existan. Se
        guarda en mayúsculas. `base` es un código IATA de 3 letras y también queda como `current_location`
        inicial. `status` vale `available` si no se envía.
      security:
        - adminServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, position]
              properties:
                user_id: { type: string, format: uuid }
                employee_code: { type: string, example: AC-1108 }
                position: { type: string, maxLength: 40, example: Comandante }
                base: { type: string, nullable: true, example: ATL }
                status: { $ref: '#/components/schemas/CrewStatus' }
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Código de empleado repetido o la cuenta ya tiene perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/crew-members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Interno]
      summary: Perfil de un tripulante (solo Admin)
      security:
        - adminServiceKey: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Interno]
      summary: Editar o desactivar el perfil (solo Admin)
      description: Solo se aplican los campos enviados. `base` en `null` o vacía la quita.
      security:
        - adminServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                employee_code: { type: string }
                position: { type: string, maxLength: 40 }
                base: { type: string, nullable: true }
                status: { $ref: '#/components/schemas/CrewStatus' }
                is_active: { type: boolean }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewProfile' }
        '400':
          description: Datos inválidos o body sin campos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Código de empleado repetido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Interno]
      summary: Borrar un perfil sin historial (solo Admin)
      description: |
        Solo para deshacer un alta que no terminó (por ejemplo, si falló el correo). Un perfil con
        ausencias nunca se borra: responde 409 y hay que desactivarlo con PATCH.
      security:
        - adminServiceKey: []
      responses:
        '204':
          description: Perfil borrado
        '401':
          description: Falta x-service-key o no es válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El tripulante no tiene perfil en Crew
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El tripulante tiene ausencias registradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminServiceKey:
      type: apiKey
      in: header
      name: x-service-key
      description: ADMIN_SERVICE_KEY, la misma en admin/.env y crew/.env.

  schemas:
    AbsenceReason:
      type: string
      enum: [illness, fatigue, emergency, transfer]
      description: illness (incapacidad), fatigue (fatiga), emergency (calamidad), transfer (traslado)
    Absence:
      type: object
      properties:
        id: { type: string, format: uuid }
        crew_user_id: { type: string, format: uuid }
        flight_id: { type: string, format: uuid, nullable: true, description: Solo en las ausencias antiguas por vuelo. }
        flight_number: { type: string, nullable: true, example: AC201 }
        flight_departure_at: { type: string, format: date-time, nullable: true }
        start_date: { type: string, format: date, nullable: true, example: '2026-11-20', description: null en las ausencias antiguas por vuelo. }
        end_date: { type: string, format: date, nullable: true, example: '2026-11-22' }
        attachment:
          allOf:
            - $ref: '#/components/schemas/AbsenceAttachment'
          nullable: true
          description: Metadatos del comprobante, o null si no tiene. Nunca incluye los bytes. No viene en la respuesta de cubrir.
        reason: { $ref: '#/components/schemas/AbsenceReason' }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
        replacement_user_id: { type: string, format: uuid, nullable: true, description: Quién cubrió la ausencia. }
        covered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AbsenceAttachment:
      type: object
      properties:
        file_name: { type: string, example: incapacidad.pdf }
        mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size_bytes: { type: integer, example: 48213 }
    AbsenceStatus:
      type: string
      enum: [reported, covered]
      description: reported (falta reemplazo), covered (ya tiene reemplazo)
    AbsenceWithCrewMember:
      allOf:
        - $ref: '#/components/schemas/Absence'
        - type: object
          properties:
            employee_code: { type: string, nullable: true, example: EMP-001 }
            position: { type: string, nullable: true, example: pilot }
            crew_name: { type: string, nullable: true, description: Nombre desde Admin (null si Admin no responde). }
            replacement_name: { type: string, nullable: true, description: Nombre del reemplazo. }
    CrewStatus:
      type: string
      enum: [available, on_duty, in_flight, medical_leave]
      default: available
    CrewProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        employee_code: { type: string, example: AC-1108 }
        position: { type: string, example: Comandante }
        base: { type: string, nullable: true, example: ATL }
        current_location: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CrewStatus' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    CertificationStatus:
      type: string
      description: verified (Verificado), pending_verification (Por verificar) o uncertified (Sin certificado).
      enum: [verified, pending_verification, uncertified]
    CrewCertification:
      type: object
      description: Fila de la tabla. Se identifica por user_id; employee_code es el ID que se muestra.
      properties:
        user_id: { type: string, format: uuid }
        employee_code: { type: string, example: AC-1108 }
        name: { type: string, nullable: true, description: Desde Admin (null si no responde). }
        email: { type: string, nullable: true }
        position: { type: string, example: Comandante }
        area: { type: string, nullable: true, enum: [flight_deck, cabin] }
        base: { type: string, nullable: true, example: ATL }
        license_number: { type: string, nullable: true }
        certificates: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/CertificationStatus' }
        updated_at: { type: string, format: date-time, nullable: true }
    CertificationDetail:
      allOf:
        - $ref: '#/components/schemas/CrewCertification'
        - type: object
          properties:
            file:
              type: object
              nullable: true
              properties:
                file_name: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer }
            history:
              type: array
              description: Del más reciente al más antiguo.
              items:
                type: object
                properties:
                  event: { type: string, enum: [registered, verified, updated] }
                  by_user_id: { type: string, format: uuid }
                  by: { type: string, nullable: true, description: Nombre del super_admin. }
                  note: { type: string, nullable: true }
                  created_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
    CrewMember:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string, format: uuid }
        name: { type: string, nullable: true, description: Nombre desde Admin (null si Admin no responde). Solo en las consultas GET. }
        employee_code: { type: string }
        position: { type: string }
        base: { type: string, nullable: true, description: Hub del tripulante (código IATA). Lo asigna Admin. }
        current_location: { type: string, nullable: true, description: Dónde está ahora; empieza en su base. }
        status: { $ref: '#/components/schemas/CrewStatus' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
