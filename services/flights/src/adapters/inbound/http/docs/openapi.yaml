openapi: 3.0.3
info:
  title: AirCrew - Flights
  version: 1.0.0
  description: |
    Aeronaves. Usa los JWT emitidos por Admin (inicia sesión en Admin con `POST /auth/login`).
    Las rutas de vuelos y aeropuertos todavía no están implementadas.
servers:
  - url: http://localhost:3001
tags:
  - name: Salud
  - name: Aeronaves

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  servicio: { type: string, example: flights }
                  estado: { type: string, example: ok }

  /aeronaves:
    post:
      tags: [Aeronaves]
      summary: Crear una aeronave (supervisor o super_admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, registration, capacity, minimum_crew, initial_destination, final_destination]
              properties:
                name: { type: string, example: Airbus A320 }
                registration: { type: string, example: HK-5000, description: Se guarda en mayúsculas y debe ser única. }
                capacity: { type: integer, minimum: 1, example: 180 }
                minimum_crew: { type: integer, minimum: 0, example: 4 }
                initial_destination: { type: string, example: BOG }
                final_destination: { type: string, example: MDE }
                status: { $ref: '#/components/schemas/AircraftStatus' }
      responses:
        '201':
          description: Aeronave creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Aircraft'
                  - type: object
                    properties:
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una aeronave con esa matrícula
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aeronaves/activas:
    get:
      tags: [Aeronaves]
      summary: Listar aeronaves en estado operating (supervisor o super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aeronaves operativas ordenadas por matrícula
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Aircraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /aeronaves/resumen:
    get:
      tags: [Aeronaves]
      summary: Contar aeronaves operativas y en mantenimiento (supervisor o super_admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen por estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  operating: { type: integer, example: 5 }
                  maintenance: { type: integer, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Falta autenticación o no es válida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AircraftStatus:
      type: string
      enum: [operating, maintenance, inactive]
      default: operating
    Error:
      type: object
      properties:
        error: { type: string }
    Aircraft:
      type: object
      properties:
        name: { type: string }
        registration: { type: string }
        capacity: { type: integer }
        minimum_crew: { type: integer }
        initial_destination: { type: string }
        final_destination: { type: string }
        status: { $ref: '#/components/schemas/AircraftStatus' }
