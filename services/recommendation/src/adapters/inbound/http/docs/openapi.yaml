openapi: 3.0.3
info:
  title: AirCrew - Recommendation
  version: 1.0.0
  description: |
    Motor de recomendación de reemplazos. No tiene base de datos: una ausencia `reported`
    de Crew es la solicitud de reemplazo, y los candidatos se calculan en cada consulta con
    datos de Crew y Flights, reenviando el token del supervisor.

    **Reglas que descartan:**
    - Disponibilidad: activo, en estado `available` y no asignado ya al vuelo.
    - Habilitación: captain y first_officer requieren `pilot`; purser y flight_attendant requieren `cabin_crew`.
    - Descanso: ningún otro vuelo a menos de 10 h antes de la salida o después de la llegada.

    **Puntaje (0 a 100):** +60 si está en la ciudad de origen; hasta +40 por baja carga
    (40 sin vuelos en las 24 h cercanas, 20 con uno, 0 con dos o más).
servers:
  - url: http://localhost:3003
tags:
  - name: Salud
  - name: Recomendación

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: recommendation }
                  status: { type: string, example: ok }

  /absences/{id}/candidates:
    get:
      tags: [Recomendación]
      summary: Candidatos para cubrir una ausencia (supervisor o super_admin)
      description: Candidatos ordenados de mayor a menor puntaje, y los descartados con sus motivos.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la ausencia en Crew.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Candidatos calculados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatesResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: Ausencia o vuelo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La ausencia ya está cubierta, el vuelo ya no admite reemplazos o el ausente ya no está en el vuelo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Crew o Flights no respondieron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/confirm:
    post:
      tags: [Recomendación]
      summary: Confirmar el reemplazo de una ausencia (supervisor o super_admin)
      description: |
        Vuelve a evaluar las reglas con datos frescos y, si el candidato sigue siendo válido,
        Flights lo pone en el vuelo en lugar del ausente (con el mismo rol) y Crew marca la
        ausencia como `covered`.

        Si Flights hizo el cambio pero Crew falló, responde 502 y se puede reintentar:
        el reemplazo ya hecho se detecta y solo se marca la ausencia.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la ausencia en Crew.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_user_id]
              properties:
                candidate_user_id: { type: string, format: uuid, description: 'user_id de un candidato de GET /absences/{id}/candidates.' }
      responses:
        '200':
          description: Reemplazo confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  absence:
                    type: object
                    description: La ausencia ya cubierta, con replacement_user_id y covered_at.
                  flight:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      flight_number: { type: string }
                      origin: { type: string }
                      destination: { type: string }
                      departure_at: { type: string, format: date-time }
                      arrival_at: { type: string, format: date-time }
                  replacement:
                    type: object
                    nullable: true
                    description: La nueva asignación en Flights (null si se hizo en un intento anterior).
                    properties:
                      id: { type: string, format: uuid }
                      flight_id: { type: string, format: uuid }
                      crew_user_id: { type: string, format: uuid }
                      role: { type: string }
                      status: { type: string, example: assigned }
                      created_at: { type: string, format: date-time }
        '400':
          description: candidate_user_id inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: Ausencia o vuelo no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El tripulante no es candidato, la ausencia ya está cubierta o el vuelo ya no admite reemplazos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Crew o Flights no respondieron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Falta autenticación, no es válida o el rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    CrewSummary:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, nullable: true, example: Juan }
        employee_code: { type: string, example: EMP-003 }
        position: { type: string, example: pilot }
        current_location: { type: string, nullable: true, example: BOG }
    Candidate:
      allOf:
        - $ref: '#/components/schemas/CrewSummary'
        - type: object
          properties:
            score: { type: integer, minimum: 0, maximum: 100, example: 100 }
            reasons:
              type: array
              items: { type: string }
              example: [Disponible, Cargo habilitado, En BOG, Sin vuelos en 24 h]
    Discarded:
      allOf:
        - $ref: '#/components/schemas/CrewSummary'
        - type: object
          properties:
            reasons:
              type: array
              items: { type: string }
              example: ['No está disponible (estado: medical_leave).']
    CandidatesResult:
      type: object
      properties:
        absence:
          type: object
          properties:
            id: { type: string, format: uuid }
            crew_user_id: { type: string, format: uuid }
            crew_name: { type: string, nullable: true }
            employee_code: { type: string, nullable: true }
            reason: { type: string, enum: [illness, fatigue, emergency, transfer] }
            status: { type: string, enum: [reported, covered] }
        flight:
          type: object
          properties:
            id: { type: string, format: uuid }
            flight_number: { type: string, example: AC201 }
            origin: { type: string, example: BOG }
            destination: { type: string, example: MDE }
            departure_at: { type: string, format: date-time }
            arrival_at: { type: string, format: date-time }
        role: { type: string, enum: [captain, first_officer, purser, flight_attendant] }
        required_position: { type: string, enum: [pilot, cabin_crew] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        discarded:
          type: array
          items: { $ref: '#/components/schemas/Discarded' }
