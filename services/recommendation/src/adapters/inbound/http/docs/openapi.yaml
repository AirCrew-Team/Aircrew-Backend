openapi: 3.0.3
info:
  title: AirCrew - Recommendation
  version: 2.0.0
  description: |
    Recomendación de reemplazos cuando un tripulante reporta una ausencia.

    **Flujo:**
    1. El tripulante reporta la ausencia en Crew. Crew pide a este servicio, en segundo plano,
       que busque candidatos (`POST /absences/{id}/suggest`, interno).
    2. **Reglas (código):** se descarta a quien no cumple alguna de las 8 reglas: rango del puesto,
       habilitación en la familia del avión, disponibilidad
       (no ausente, incapacitado ni de vacaciones), sin vuelos que se crucen, 10 h de descanso,
       máximo 100 h de vuelo en el mes local de su base (14 CFR 117.23, el mismo tope de Mis Vuelos)
       e inglés OACI 4 para pilotos en vuelos internacionales. Sin habilitaciones o sin nivel de inglés
       registrados (p. ej. un tripulante recién creado) no se descarta: queda con `warnings` y va al final.
    3. **Prioridad:** de guardia en la base de salida → libre en la base → otra base (si alcanza a llegar).
    4. **IA (Claude):** ordena de 3 a 5 candidatos y explica en español por qué. Proveedor
       configurable: Claude Code (`AI_PROVIDER=claude_code`, suscripción) o la API (`AI_PROVIDER=api`).
    5. **Sin respaldo:** si la IA está apagada o no responde, la ausencia queda con
       `suggestions_state: "error"` y el supervisor recibe el aviso; puede pedir otra ronda
       (`POST /absences/{id}/regenerate`), que responde 503 `ai_unavailable` si la IA sigue sin responder.
    6. Se guardan los candidatos y la auditoría de la decisión, y los supervisores reciben
       `absence:suggestions_ready` por SSE.

    **Al confirmar** un candidato, la ausencia queda `pending_ack` y el elegido recibe
    `assignment:replacement`. Cuando pulsa «Enterado» (`POST /api/flights/assignments/{id}/acknowledge`)
    la ausencia queda `covered`. Si vence el plazo (30 min o la mitad del tiempo hasta la salida,
    lo que sea menor), la ausencia vuelve a la cola, el candidato queda `missed` y los supervisores
    reciben `absence:deadline_missed` con la siguiente opción.
servers:
  - url: http://localhost:3003
tags:
  - name: Salud
  - name: Recomendación
  - name: Programación
    description: |
      Armar la tripulación de los vuelos (pantalla de Programación). Puestos de cada vuelo:
      Capitán y Primer Oficial siempre; Piloto de relevo si dura más de 8 h; Jefe de Cabina
      más 1 TCP por cada 50 sillas.
  - name: Interno
    description: Endpoints para otros servicios (token de servicio), no para el frontend.

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que el servicio está activo
      responses:
        '200':
          description: Servicio activo

  /absences/{id}/candidates:
    get:
      tags: [Recomendación]
      summary: Candidatos propuestos para una ausencia (supervisor o super_admin)
      description: |
        Devuelve la última ronda guardada, en orden. Si la IA todavía está buscando,
        `suggestions_state` es `searching` y `candidates` viene vacío: esperar el evento
        `absence:suggestions_ready` y volver a pedir.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbsenceId'
      responses:
        '200':
          description: Candidatos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatesResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /absences/{id}/regenerate:
    post:
      tags: [Recomendación]
      summary: Pedir otra ronda de candidatos (supervisor o super_admin)
      description: |
        Vuelve a aplicar las reglas y la IA con datos frescos y devuelve los candidatos nuevos
        (mismo formato que GET /candidates). Quien ya dejó vencer su plazo no se vuelve a proponer.
        Responde 503 con code ai_unavailable si la IA no responde o no está configurada
        (p. ej. «La IA no está configurada: falta CLAUDE_CODE_OAUTH_TOKEN.»).
        Con Claude Code puede tardar entre 10 y 40 segundos.

        **reason** (opcional, máx. 300 caracteres): preferencia del supervisor, por ejemplo
        «Preferir a alguien con experiencia en la ruta JFK-LAX». Se le pasa a Claude como dato,
        solo para ordenar y explicar: las 8 reglas se aplican antes y no se las puede saltar.
        El rationale de cada candidato dice cómo se tuvo en cuenta. Queda guardado con la ronda
        y se devuelve en `reason`. Vacío o ausente: busca igual que siempre.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbsenceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300, example: Preferir a alguien con experiencia en la ruta JFK-LAX }
      responses:
        '200':
          description: Candidatos de la nueva ronda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatesResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: 'La ausencia ya está cubierta, no tiene vuelo («Esta ausencia no tiene un vuelo asociado.»), el vuelo ya no admite reemplazos o el ausente ya no está en el vuelo'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Crew o Flights no respondieron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/confirm:
    post:
      tags: [Recomendación]
      summary: Confirmar un candidato (supervisor o super_admin)
      description: |
        Vuelve a evaluar las 8 reglas con datos frescos. Si el candidato sigue siendo válido:
        Flights lo pone en el puesto como reemplazo (con quién lo aprobó y el plazo), la ausencia
        queda `pending_ack` y el candidato recibe `assignment:replacement` en su canal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbsenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_user_id]
              properties:
                candidate_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Reemplazo aprobado; esperando «Enterado»
          content:
            application/json:
              schema:
                type: object
                properties:
                  absence: { type: object, description: 'La ausencia en estado pending_ack.' }
                  flight: { $ref: '#/components/schemas/FlightSummary' }
                  replacement: { type: object, description: 'La asignación del reemplazo en Flights.' }
                  deadline_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: |
            code: candidate_not_eligible (no cumple una regla; el mensaje dice cuál),
            candidate_missed (ya dejó vencer su plazo), absence_pending_ack, absence_covered o flight_closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: El reemplazo quedó en el vuelo pero no se pudo actualizar la ausencia; se puede reintentar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /absences/{id}/suggest:
    post:
      tags: [Interno]
      summary: Buscar candidatos en segundo plano (token de servicio)
      description: Lo llama Crew al reportarse una ausencia. Responde de inmediato y avisa por SSE al terminar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbsenceId'
      responses:
        '202':
          description: Búsqueda iniciada
        '403': { $ref: '#/components/responses/Error' }

  /schedule/days:
    get:
      tags: [Programación]
      summary: Resumen de los próximos días (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          description: AAAA-MM-DD. Por defecto, hoy en la zona de la base (sin base, Nueva York).
          schema: { type: string, example: '2026-11-19' }
        - name: days
          in: query
          description: De 1 a 14. Por defecto 7.
          schema: { type: integer, example: 7 }
        - name: base
          in: query
          description: IATA de la base del supervisor (iata de GET /api/admin/bases/me). Solo vuelos que salen de ahí, por días de su zona horaria. Sin base, todos y los días de Nueva York.
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Un elemento por día
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, example: '2026-11-20' }
                    flight_count: { type: integer }
                    pending_count: { type: integer, description: Vuelos sin tripulación confirmada. }
        '400': { $ref: '#/components/responses/Error' }

  /schedule:
    get:
      tags: [Programación]
      summary: Vuelos de un día con sus puestos (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          description: AAAA-MM-DD, día local de la base (sin base, Nueva York). Por defecto, hoy.
          schema: { type: string, example: '2026-11-20' }
        - name: base
          in: query
          description: IATA de la base del supervisor (iata de GET /api/admin/bases/me). Solo vuelos que salen de ahí, por días de su zona horaria. Sin base, todos y los días de Nueva York.
          schema: { type: string, example: JFK }
      responses:
        '200':
          description: Vuelos programados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlannedFlight' }

  /flights/{id}/plan:
    get:
      tags: [Programación]
      summary: Un vuelo con sus puestos (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Vuelo programado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedFlight' }
        '404': { $ref: '#/components/responses/Error' }

  /flights/{id}/slots/{slotId}/candidates:
    get:
      tags: [Programación]
      summary: Candidatos para un puesto (supervisor o super_admin)
      description: Elegibles (cumplen las 8 reglas) ordenados por puntaje, y no elegibles del mismo rango con el primer motivo que falla.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
        - name: slotId
          in: path
          required: true
          description: 'Puesto: captain, first_officer, relief, purser, fa-1, fa-2...'
          schema: { type: string, example: first_officer }
      responses:
        '200':
          description: Candidatos
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot: { type: object, properties: { id: { type: string }, label: { type: string }, accepts: { type: array, items: { type: string } } } }
                  eligible:
                    type: array
                    items:
                      type: object
                      properties:
                        crew_id: { type: string, format: uuid }
                        employee_code: { type: string }
                        full_name: { type: string }
                        rank: { type: string }
                        base: { type: string }
                        month_hours: { type: number }
                        score: { type: integer }
                        summary: { type: string, example: 'Habilitado en A320 · 40 h de 90 · 20 h de descanso' }
                  ineligible:
                    type: array
                    items:
                      type: object
                      properties:
                        crew_id: { type: string, format: uuid }
                        full_name: { type: string }
                        reason: { type: string, example: No está habilitado en 787. }
        '404': { $ref: '#/components/responses/Error' }

  /flights/{id}/slots/{slotId}:
    put:
      tags: [Programación]
      summary: Asignar a mano un puesto (supervisor o super_admin)
      description: Valida las 8 reglas. Si no cumple, 409 con el motivo (por ejemplo «No está habilitado en 787.»).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
        - name: slotId
          in: path
          required: true
          description: 'Puesto: captain, first_officer, relief, purser, fa-1, fa-2...'
          schema: { type: string, example: first_officer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crew_id]
              properties:
                crew_id: { type: string, format: uuid }
      responses:
        '200':
          description: Vuelo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedFlight' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: 'code: not_eligible (motivo de regla), slot_taken, crew_confirmed, already_on_flight'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Programación]
      summary: Quitar a alguien de un puesto (supervisor o super_admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
        - name: slotId
          in: path
          required: true
          description: 'Puesto: captain, first_officer, relief, purser, fa-1, fa-2...'
          schema: { type: string, example: first_officer }
      responses:
        '200':
          description: Vuelo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedFlight' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /flights/{id}/suggest:
    post:
      tags: [Programación]
      summary: Sugerir con IA la tripulación de los puestos vacíos (supervisor o super_admin)
      description: |
        Para cada puesto vacío: las 8 reglas filtran a los elegibles y Claude elige al mejor
        para cada puesto (sin repetir personas), buscando repartir la carga, cuidar el descanso
        y equilibrar la experiencia. Si Claude no responde o la IA no está configurada: 503 ai_unavailable
        (el mensaje dice qué falta). Cada asignación queda con
        `source` (ai o rule) y `rationale`. El vuelo **nunca se confirma solo**.
        Con Claude Code tarda entre 20 y 40 segundos.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Vuelo con los puestos sugeridos; `unfilled` lista los que nadie pudo cubrir
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlannedFlight'
                  - type: object
                    properties:
                      unfilled:
                        type: array
                        items:
                          type: object
                          properties:
                            slot_id: { type: string }
                            label: { type: string }
                            reason: { type: string }
        '409':
          description: 'code: no_empty_slots, no_candidates (nadie cumple las reglas) o crew_confirmed'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flights/{id}/confirm:
    post:
      tags: [Programación]
      summary: Confirmar la tripulación (supervisor o super_admin)
      description: Exige todos los puestos ocupados. Después ya no se puede editar.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del vuelo.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Vuelo confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedFlight' }
        '409':
          description: 'code: crew_incomplete o crew_confirmed'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/users/{userId}/suggestions:
    delete:
      tags: [Interno]
      summary: 'Interno: borrar las sugerencias que nombran a una cuenta eliminada (token de servicio)'
      description: |
        Lo usa Admin al eliminar una cuenta (`DELETE /users/{id}/permanent`): borra las filas de
        `replacement_suggestions` con ese `crew_user_id`. Repetirlo no falla: devuelve 0. El gateway
        responde 404 a `/api/recommendation/internal/*`.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sugerencias borradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AbsenceId:
      name: id
      in: path
      required: true
      description: Id de la ausencia en Crew.
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: 'Error: { error, code?, field? }'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string, description: Código fijo para la lógica del frontend. }
        field: { type: string, description: Campo del formulario que falló. }
    FlightSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        flight_number: { type: string, example: DL1102 }
        origin: { type: string, example: JFK }
        destination: { type: string, example: MIA }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        gate: { type: string, nullable: true, example: C04 }
        scope: { type: string, enum: [domestic, international] }
        aircraft_family: { type: string, nullable: true, example: A320 }
    Candidate:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, nullable: true, example: Andrés Gómez }
        employee_code: { type: string, example: EMP-021 }
        rank: { type: string, enum: [captain, first_officer, purser, flight_attendant] }
        base: { type: string, example: JFK }
        rank_position: { type: integer, example: 1, description: Lugar en la lista (1 = primera opción). }
        affinity: { type: integer, minimum: 0, maximum: 100, example: 96 }
        affinity_label: { type: string, enum: [optimal, high, acceptable], description: 'optimal ≥ 90, high 75–89, acceptable < 75' }
        checks:
          type: array
          items: { type: string }
          example: [Habilitado en A320, 'De guardia, a 12 min de la rampa', 10 h de margen este mes]
        rationale: { type: string, example: 'Es el más rápido en llegar: 12 min a la rampa frente a 174 min hasta la salida...' }
        source: { type: string, enum: [ai], description: 'Siempre ai: ordenado por Claude.' }
        status: { type: string, enum: [proposed, offered, missed, accepted, discarded] }
        location: { type: string, nullable: true, example: Sala de tripulaciones T1 }
        minutes_to_ramp: { type: integer, nullable: true, example: 12 }
        phone: { type: string, nullable: true }
        radio_channel: { type: string, nullable: true, example: OPS-2 }
    CandidatesResult:
      type: object
      properties:
        absence:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string, example: SOL-00042, description: Número de solicitud legible. }
            crew_user_id: { type: string, format: uuid }
            crew_name: { type: string, nullable: true }
            employee_code: { type: string, nullable: true }
            reason: { type: string, enum: [illness, fatigue, emergency, transfer] }
            notes: { type: string, nullable: true }
            status: { type: string, enum: [reported, pending_ack, covered, cancelled] }
            reported_at: { type: string, format: date-time }
        flight: { $ref: '#/components/schemas/FlightSummary' }
        slot_role: { type: string, enum: [captain, first_officer, purser, flight_attendant] }
        suggestions_state: { type: string, enum: [searching, ready, none, error], description: 'error = la IA no respondió; pedir otra ronda.' }
        round: { type: integer, nullable: true }
        reason: { type: string, nullable: true, description: Motivo del supervisor con el que se pidió esta ronda. }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
    PlannedFlight:
      type: object
      properties:
        id: { type: string, format: uuid }
        flight_number: { type: string, example: DL0044 }
        date: { type: string, example: '2026-11-20' }
        origin: { type: object, properties: { code: { type: string, example: JFK }, city: { type: string, example: Nueva York } } }
        destination: { type: object, properties: { code: { type: string, example: MAD }, city: { type: string, example: Madrid } } }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        duration_minutes: { type: integer, example: 620 }
        scope: { type: string, enum: [domestic, international] }
        gate: { type: string, nullable: true }
        aircraft:
          type: object
          properties:
            model: { type: string, example: Boeing 787-8 }
            family: { type: string, example: '787' }
            registration: { type: string, example: N781AV }
            seats: { type: integer, example: 248 }
        minimum_crew: { type: object, properties: { pilots: { type: integer, example: 3 }, cabin: { type: integer, example: 5 } } }
        status: { type: string, enum: [unassigned, incomplete, complete, confirmed] }
        slots:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: relief }
              role: { type: string, example: relief }
              accepts: { type: array, items: { type: string }, example: [captain, first_officer] }
              label: { type: string, example: Piloto de relevo }
              assignee:
                type: object
                nullable: true
                properties:
                  crew_id: { type: string, format: uuid }
                  employee_code: { type: string }
                  full_name: { type: string, example: Ricardo Morales }
                  rank: { type: string }
                  month_hours: { type: integer, example: 52 }
                  max_month_hours: { type: integer, example: 90 }
                  source: { type: string, enum: [manual, ai, rule] }
                  rationale: { type: string, nullable: true }
                  is_replacement: { type: boolean }
                  warnings:
                    type: array
                    items: { type: string }
                    description: Datos sin registrar del tripulante, p. ej. «Sin habilitación registrada en A320».
